<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Vladyslav GitHub Hero</title>
  <desc id="desc">Animated dark blue liquid hero banner.</desc>

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0A1222"/>
      <stop offset="100%" stop-color="#07152D"/>
    </linearGradient>

    <linearGradient id="liquid"
                    x1="0" y1="230"
                    x2="1200" y2="360"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D214A"/>
      <stop offset="40%" stop-color="#173D86"/>
      <stop offset="72%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="surface"
                    x1="0" y1="0"
                    x2="1200" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%"
            stop-color="#60A5FA"
            stop-opacity="0.15"/>

      <stop offset="45%"
            stop-color="#93C5FD"
            stop-opacity="0.95"/>

      <stop offset="70%"
            stop-color="#60A5FA"
            stop-opacity="0.75"/>

      <stop offset="100%"
            stop-color="#3B82F6"
            stop-opacity="0.18"/>
    </linearGradient>

    <radialGradient id="blueGlow"
                    cx="0"
                    cy="0"
                    r="1"
                    gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(940 150) scale(320 230)">
      <stop stop-color="#2563EB"
            stop-opacity="0.38"/>

      <stop offset="1"
            stop-color="#2563EB"
            stop-opacity="0"/>
    </radialGradient>

    <filter id="blur"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <filter id="glow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">
      <feGaussianBlur stdDeviation="5"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- BACKGROUND -->

  <rect width="1200"
        height="360"
        fill="url(#bg)"/>


  <!-- BLUE AMBIENT LIGHT -->

  <ellipse cx="940"
           cy="150"
           rx="310"
           ry="220"
           fill="url(#blueGlow)"
           filter="url(#blur)">

    <animate attributeName="cx"
             values="940;1010;960;940"
             dur="15s"
             repeatCount="indefinite"/>

    <animate attributeName="cy"
             values="150;130;165;150"
             dur="15s"
             repeatCount="indefinite"/>

  </ellipse>


  <!-- TEXT -->

  <text x="70"
        y="70"
        fill="#60A5FA"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="15"
        font-weight="700"
        letter-spacing="0.22em">
    GITHUB PROFILE
  </text>

  <text x="70"
        y="132"
        fill="#F8FAFC"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="58"
        font-weight="800">
    Vladyslav
  </text>

  <text x="70"
        y="174"
        fill="#BFDBFE"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="27"
        font-weight="600">
    Full-Stack Developer
  </text>

  <text x="70"
        y="211"
        fill="#94A3B8"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="19"
        font-weight="400">
    Building clean, thoughtful web applications.
  </text>


  <!-- LIQUID -->

  <path fill="url(#liquid)">
    <animate
      attributeName="d"
      dur="11s"
      repeatCount="indefinite"

      values="

      M0 270
      C120 248 220 282 345 268
      C470 254 565 232 680 246
      C795 261 885 292 995 280
      C1080 271 1145 248 1200 258
      L1200 360
      L0 360
      Z;

      M0 260
      C115 278 230 252 350 244
      C470 235 575 268 690 277
      C805 286 900 253 1005 244
      C1090 237 1150 257 1200 250
      L1200 360
      L0 360
      Z;

      M0 278
      C130 248 230 260 350 284
      C470 305 580 278 690 259
      C800 241 905 247 1000 267
      C1090 286 1150 279 1200 266
      L1200 360
      L0 360
      Z;

      M0 270
      C120 248 220 282 345 268
      C470 254 565 232 680 246
      C795 261 885 292 995 280
      C1080 271 1145 248 1200 258
      L1200 360
      L0 360
      Z

      "/>
  </path>


  <!-- LIQUID HIGHLIGHT -->

  <path fill="none"
        stroke="url(#surface)"
        stroke-width="3"
        stroke-linecap="round"
        filter="url(#glow)">

    <animate
      attributeName="d"
      dur="11s"
      repeatCount="indefinite"

      values="

      M0 270
      C120 248 220 282 345 268
      C470 254 565 232 680 246
      C795 261 885 292 995 280
      C1080 271 1145 248 1200 258;

      M0 260
      C115 278 230 252 350 244
      C470 235 575 268 690 277
      C805 286 900 253 1005 244
      C1090 237 1150 257 1200 250;

      M0 278
      C130 248 230 260 350 284
      C470 305 580 278 690 259
      C800 241 905 247 1000 267
      C1090 286 1150 279 1200 266;

      M0 270
      C120 248 220 282 345 268
      C470 254 565 232 680 246
      C795 261 885 292 995 280
      C1080 271 1145 248 1200 258

      "/>

  </path>

</svg>
